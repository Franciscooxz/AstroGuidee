# Config de herramientas de desarrollo (linting + formato).
# El alcance es AstroGuide: apps/astro + el paquete de proyecto astroguide.

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '/migrations/'

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/W: pycodestyle · F: pyflakes (imports/vars sin usar) · I: orden de imports
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # longitud de linea -> la gestiona black
    "E741",  # nombres "ambiguos" (usamos l = lesson, legible en contexto)
]

[tool.ruff.lint.per-file-ignores]
# El paquete views/ reexporta desde common con star-imports a proposito.
"apps/astro/views/*.py" = ["F401", "F403", "F405"]
