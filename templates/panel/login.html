<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — AM Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-bg { position: fixed; inset: 0; background: linear-gradient(135deg, #0a0a0a 60%, #1a1200 100%); }
    .login-bg::before { content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at center, rgba(245,197,24,0.05) 0%, transparent 60%); }
    .login-card {
      position: relative; z-index: 10;
      background: #141414; border: 1px solid #2a2a2a; border-radius: 12px;
      width: 100%; max-width: 400px; padding: 40px; margin: 20px;
    }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .brand { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: 2px; }
    .login-logo .brand span { color: #F5C518; }
    .login-logo .sub { font-size: 12px; color: #666; margin-top: 4px; }
    .login-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: #666; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #555; font-size: 14px; }
    input {
      width: 100%; background: #0d0d0d; border: 1px solid #2a2a2a; color: #e0e0e0;
      padding: 11px 14px 11px 42px; border-radius: 6px; font-size: 14px; font-family: 'Poppins', sans-serif;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #F5C518; }
    .btn-login {
      width: 100%; background: #F5C518; color: #000; border: none; padding: 12px;
      border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
      transition: 0.2s; letter-spacing: 0.5px;
    }
    .btn-login:hover { background: #d4a400; }
    .error-msg { background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.3); color: #f87171; padding: 10px 14px; border-radius: 6px; margin-bottom: 18px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .login-footer { text-align: center; margin-top: 20px; font-size: 12px; color: #555; }
    .login-footer a { color: #F5C518; text-decoration: none; }
  </style>
</head>
<body>
<div class="login-bg"></div>
<div class="login-card">
  <div class="login-logo">
    <div class="brand"><span>ARTISTIC</span> MOLD</div>
    <div class="sub">Panel de Administración</div>
  </div>

  {% if messages %}
  {% for msg in messages %}
  <div class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>
  {% endfor %}
  {% endif %}

  <p class="login-title">Iniciar Sesión</p>
  <p class="login-sub">Ingresa tus credenciales de staff</p>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Usuario</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" name="username" placeholder="tu_usuario" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn-login">Entrar al Panel</button>
  </form>

  <div class="login-footer">
    <a href="/"><i class="fas fa-arrow-left"></i> Volver al sitio web</a>
  </div>
</div>
</body>
</html>
