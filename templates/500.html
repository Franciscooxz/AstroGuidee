<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error del servidor — AstroGuide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      color: #f4f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #0e0e12;
    }
    .error-card {
      width: min(480px, 100%);
      padding: 36px 28px 32px;
      border-radius: 18px;
      background: #1c1c26;
      border: 2px solid #32323f;
      box-shadow: 0 4px 0 #32323f;
    }
    .error-code {
      font-size: clamp(72px, 16vw, 112px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      color: #7c4dff;
    }
    .error-title { font-size: 24px; font-weight: 800; margin: 12px 0 8px; }
    .error-desc { color: #b7b7c9; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .btn-home {
      display: inline-flex;
      align-items: center;
      padding: 12px 22px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      font-weight: 800;
      background: #7c4dff;
      border: 2px solid #5426c4;
      box-shadow: 0 4px 0 #5426c4;
    }
    .btn-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #5426c4; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">500</div>
    <h1 class="error-title">Error interno del servidor</h1>
    <p class="error-desc">Algo falló de nuestro lado.<br>Intenta de nuevo en unos minutos.</p>
    <a href="/" class="btn-home">Volver al inicio</a>
  </div>
</body>
</html>
