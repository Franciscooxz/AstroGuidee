<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — AstroGuide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      color: #eef2ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background:
        radial-gradient(60% 55% at 15% 10%, rgba(79, 124, 255, 0.28), transparent 60%),
        radial-gradient(55% 50% at 88% 8%, rgba(139, 92, 255, 0.30), transparent 62%),
        linear-gradient(180deg, #0a0b1e, #05060f 70%);
    }
    .error-wrap { max-width: 520px; }
    .error-code {
      font-size: clamp(88px, 18vw, 140px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(120deg, #6ea8ff, #b18bff 55%, #d16bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .error-title { font-size: 24px; font-weight: 700; margin: 18px 0 10px; }
    .error-desc { color: #bcc4e6; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    .btn-home {
      display: inline-flex;
      align-items: center;
      padding: 12px 26px;
      border-radius: 100px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      background: linear-gradient(135deg, #4f7cff, #8b5cff);
      box-shadow: 0 10px 26px -8px rgba(139, 92, 255, .8);
    }
  </style>
</head>
<body>
  <div class="error-wrap">
    <div class="error-code">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">Esa ruta no existe en AstroGuide.<br>Vuelve al inicio y sigue la constelación.</p>
    <a href="/" class="btn-home">Volver al inicio</a>
  </div>
</body>
</html>
