<div class="constellation" style="--acc: {{ u.unit.accent|default:'#8b5cff' }}; height: {{ u.h }}px">
  <svg class="cst-lines" data-cst preserveAspectRatio="none" aria-hidden="true"></svg>
  {% for l in u.lessons %}
  {% if l.status == 'locked' %}
  <div class="star locked" data-star style="left: {{ l.cx }}%; top: {{ l.cy }}px">
    <span class="star-core"></span>
    {% if l.show_label %}<span class="star-label locked">{{ l.title }}</span>{% endif %}
  </div>
  {% else %}
  <a href="{% url 'astro:lesson' l.slug %}" class="star {{ l.status }}" data-star {% if l.status == 'current' %}id="route-current"{% endif %} style="left: {{ l.cx }}%; top: {{ l.cy }}px">
    {% if l.status == 'current' %}<span class="star-tip">¡Empieza!</span>{% endif %}
    <span class="star-core">{% include 'astro/_icon.html' with name=l.icon size=28 %}</span>
    {% if l.show_label %}<span class="star-label {{ l.status }}">{{ l.title }}</span>{% endif %}
  </a>
  {% endif %}
  {% endfor %}
</div>
