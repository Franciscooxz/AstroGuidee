{% load static %}
<div class="flip" tabindex="0" style="--_glow: {{ card.category.accent|default:'#8b5cff' }}44;">
  <div class="flip-inner">
    <div class="flip-face flip-front">
      <div class="ico-wrap">{% include 'astro/_icon.html' with name=card.icon size=76 %}</div>
      <h3>{{ card.title }}</h3>
      {% if card.subtitle %}<div class="sub">{{ card.subtitle }}</div>{% endif %}
      <div class="hint">Toca para saber mas ↺</div>
    </div>
    <div class="flip-face flip-back">
      <h4>{{ card.title }}</h4>
      <p>{{ card.summary }}</p>
      {% if card.fun_fact %}<div class="fact"><b>Dato curioso:</b> {{ card.fun_fact }}</div>{% endif %}
    </div>
  </div>
</div>
